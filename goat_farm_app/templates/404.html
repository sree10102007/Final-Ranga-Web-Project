<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found - Ranga Farms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style nonce="{{ csp_nonce }}">
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            margin: 0;
        }
        .error-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem 2rem;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 1rem;
        }
        .btn-home {
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            color: #ffffff;
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 700;
            border-radius: 50px;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-home:hover {
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(46, 125, 50, 0.4);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="fs-1 mb-2">🐐</div>
        <div class="error-code">404</div>
        <h3 class="fw-bold mb-3">Page Not Found</h3>
        <p class="text-secondary mb-4">The page or resource you are looking for might have been moved, deleted, or does not exist.</p>
        <a href="{{ url_for('dashboard') }}" class="btn-home"><i class="bi bi-house-door-fill me-2"></i>Return to Dashboard</a>
    </div>
</body>
</html>
